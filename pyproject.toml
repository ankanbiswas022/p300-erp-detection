[project]
name = "p300erp"
version = "0.1.0"
description = "Single-trial P300 detection on a public speller dataset: xDAWN + Riemannian geometry vs EEGNet, with decision-level aggregation"
authors = [{ name = "Ankan Biswas", email = "ankanbiswas022@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["mne>=1.6", "moabb", "pyriemann", "numpy", "scipy", "pandas",
                "scikit-learn>=1.4", "torch", "matplotlib", "joblib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/p300erp/run.py" = ["E402"]
